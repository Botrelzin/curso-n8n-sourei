  <text x="58" y="88" class="heading">Identidade e deduplicação</text>
  <text x="58" y="116" class="intro">Identidade melhora associação. A chave estável evita contagem repetida.</text>
  <line x1="58" y1="137" x2="1142" y2="137" stroke="#e3e5ea"/>
  <g class="node"><rect x="58" y="206" width="224" height="116" rx="16" fill="#f4f6f9" stroke="#4b5563" stroke-width="2"/><circle cx="86" cy="234" r="14" fill="#4b5563"/><text x="86" y="239" class="badge" text-anchor="middle">1</text><text x="114" y="241" class="node-title" text-anchor="start">Sinais de identidade</text><text x="114" y="263" class="node-sub" text-anchor="start">e-mail, telefone, cliente</text></g><g class="node"><rect x="58" y="380" width="224" height="116" rx="16" fill="#f4f6f9" stroke="#4b5563" stroke-width="2"/><circle cx="86" cy="408" r="14" fill="#4b5563"/><text x="86" y="413" class="badge" text-anchor="middle">2</text><text x="114" y="415" class="node-title" text-anchor="start">Chave do evento</text><text x="114" y="437" class="node-sub" text-anchor="start">pedido + tipo + tempo</text></g><path d="M 282 264 L 440 312" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="440,312 431.4,302.5 427.6,315.1" fill="#12727c"/><rect x="306.0" y="263.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="361.0" y="279.0" class="edge-label" text-anchor="middle">normaliza</text><path d="M 282 438 L 440 370" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="440,370 427.3,368.3 432.5,380.4" fill="#12727c"/><rect x="306.0" y="379.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="361.0" y="395.0" class="edge-label" text-anchor="middle">compõe</text><g class="node"><rect x="440" y="258" width="300" height="166" rx="16" fill="#e7edf7" stroke="#1e4a96" stroke-width="2"/><circle cx="468" cy="286" r="14" fill="#1e4a96"/><text x="468" y="291" class="badge" text-anchor="middle">ID</text><text x="496" y="293" class="node-title" text-anchor="start">Camada de identidade</text><text x="496" y="315" class="node-sub" text-anchor="start">normaliza • protege • associa</text></g><text x="468" y="350" class="note-strong" text-anchor="start">mesma pessoa, sinais consistentes</text><text x="468" y="378" class="note" text-anchor="start">mesmo evento, chave estável</text><path d="M 740 312 L 894 248" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="894,248 881.3,246.1 886.4,258.3" fill="#12727c"/><rect x="762.0" y="255.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="817.0" y="271.0" class="edge-label" text-anchor="middle">enriquece</text><path d="M 740 370 L 894 438" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="894,438 886.6,427.5 881.3,439.6" fill="#12727c"/><rect x="762.0" y="379.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="817.0" y="395.0" class="edge-label" text-anchor="middle">deduplica</text><g class="node"><rect x="894" y="196" width="248" height="108" rx="16" fill="#e2f4f5" stroke="#12727c" stroke-width="2"/><circle cx="922" cy="224" r="14" fill="#12727c"/><text x="922" y="229" class="badge" text-anchor="middle">A</text><text x="950" y="231" class="node-title" text-anchor="start">Matching</text><text x="950" y="253" class="node-sub" text-anchor="start">mais chance de associação</text></g><g class="node"><rect x="894" y="386" width="248" height="108" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="922" cy="414" r="14" fill="#16a34a"/><text x="922" y="419" class="badge" text-anchor="middle">B</text><text x="950" y="421" class="node-title" text-anchor="start">Deduplicação</text><text x="950" y="443" class="node-sub" text-anchor="start">uma compra, uma contagem</text></g><rect x="380" y="494" width="424" height="74" rx="14" fill="#fbe4e4" stroke="#d14343"/><text x="592" y="524" class="section" text-anchor="middle">NUNCA USE O DADO BRUTO SEM REGRA</text><text x="592" y="548" class="note" text-anchor="middle">Consentimento e minimização vêm antes do envio.</text>

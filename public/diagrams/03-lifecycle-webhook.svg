<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="03-lifecycle-webhook-title 03-lifecycle-webhook-desc">
  <title id="03-lifecycle-webhook-title">Lifecycle de um webhook</title>
  <desc id="03-lifecycle-webhook-desc">Receber, responder, persistir e processar são etapas diferentes.</desc>
  <style>
    svg { background:#ffffff; font-family:Inter,Segoe UI,Arial,sans-serif; }
    .kicker { font-size:13px; font-weight:800; letter-spacing:2px; fill:#12727c; }
    .heading { font-size:29px; font-weight:800; fill:#111827; }
    .intro { font-size:14px; fill:#4b5563; }
    .node-title { font-size:16px; font-weight:800; fill:#111827; }
    .node-sub { font-size:12px; fill:#4b5563; }
    .badge { font-size:12px; font-weight:800; fill:#ffffff; }
    .edge-label { font-size:11px; font-weight:700; fill:#4b5563; }
    .section { font-size:12px; font-weight:800; letter-spacing:1.4px; fill:#1e4a96; }
    .note { font-size:13px; fill:#374151; }
    .note-strong { font-size:13px; font-weight:800; fill:#111827; }
    .footer { font-size:12px; fill:#6b7280; }
    .mono { font-family:Consolas,monospace; font-size:12px; fill:#163a78; }
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="16" height="675" fill="#1e4a96"/>
  <rect x="16" y="0" width="7" height="675" fill="#25acb9"/>
  <text x="58" y="52" class="kicker">CONTRATO ASSÍNCRONO</text>
  <text x="58" y="88" class="heading">Lifecycle de um webhook</text>
  <text x="58" y="116" class="intro">Receber, responder, persistir e processar são etapas diferentes.</text>
  <line x1="58" y1="137" x2="1142" y2="137" stroke="#e3e5ea"/>
  <path d="M 208 276 L 282 276" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="282,276 271.0,269.4 271.0,282.6" fill="#12727c"/><rect x="190.0" y="251.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="245.0" y="267.0" class="edge-label" text-anchor="middle">POST</text><path d="M 442 276 L 516 276" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="516,276 505.0,269.4 505.0,282.6" fill="#12727c"/><rect x="424.0" y="251.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="479.0" y="267.0" class="edge-label" text-anchor="middle">202 rápido</text><path d="M 676 276 L 750 276" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="750,276 739.0,269.4 739.0,282.6" fill="#12727c"/><rect x="658.0" y="251.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="713.0" y="267.0" class="edge-label" text-anchor="middle">fila</text><path d="M 910 276 L 984 276" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="984,276 973.0,269.4 973.0,282.6" fill="#12727c"/><rect x="892.0" y="251.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="947.0" y="267.0" class="edge-label" text-anchor="middle">processa</text><g class="node"><rect x="58" y="224" width="150" height="104" rx="16" fill="#e2f4f5" stroke="#12727c" stroke-width="2"/><circle cx="86" cy="252" r="14" fill="#12727c"/><text x="86" y="257" class="badge" text-anchor="middle">1</text><text x="114" y="259" class="node-title" text-anchor="start">Emissor</text><text x="114" y="281" class="node-sub" text-anchor="start">gera o evento</text></g><g class="node"><rect x="282" y="224" width="160" height="104" rx="16" fill="#e7edf7" stroke="#1e4a96" stroke-width="2"/><circle cx="310" cy="252" r="14" fill="#1e4a96"/><text x="310" y="257" class="badge" text-anchor="middle">2</text><text x="338" y="259" class="node-title" text-anchor="start">Webhook</text><text x="338" y="281" class="node-sub" text-anchor="start">autentica e lê</text></g><g class="node"><rect x="516" y="224" width="160" height="104" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="544" cy="252" r="14" fill="#16a34a"/><text x="544" y="257" class="badge" text-anchor="middle">3</text><text x="572" y="259" class="node-title" text-anchor="start">Resposta</text><text x="572" y="281" class="node-sub" text-anchor="start">aceita ou rejeita</text></g><g class="node"><rect x="750" y="224" width="160" height="104" rx="16" fill="#e7edf7" stroke="#1e4a96" stroke-width="2"/><circle cx="778" cy="252" r="14" fill="#1e4a96"/><text x="778" y="257" class="badge" text-anchor="middle">4</text><text x="806" y="259" class="node-title" text-anchor="start">Persistência</text><text x="806" y="281" class="node-sub" text-anchor="start">protege o dado</text></g><g class="node"><rect x="984" y="224" width="158" height="104" rx="16" fill="#e2f4f5" stroke="#12727c" stroke-width="2"/><circle cx="1012" cy="252" r="14" fill="#12727c"/><text x="1012" y="257" class="badge" text-anchor="middle">5</text><text x="1040" y="259" class="node-title" text-anchor="start">Worker</text><text x="1040" y="281" class="node-sub" text-anchor="start">executa depois</text></g><path d="M 1062 328 L 1062 432" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="1062,432 1068.6,421.0 1055.4,421.0" fill="#12727c"/><rect x="1007.0" y="355.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="1062.0" y="371.0" class="edge-label" text-anchor="middle">resultado</text><path d="M 984 484 L 910 484" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><polygon points="910,484 921.0,490.6 921.0,477.4" fill="#d97706"/><rect x="892.0" y="459.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="947.0" y="475.0" class="edge-label" text-anchor="middle">se falhar</text><g class="node"><rect x="910" y="432" width="152" height="104" rx="16" fill="#f4f6f9" stroke="#4b5563" stroke-width="2"/><circle cx="938" cy="460" r="14" fill="#4b5563"/><text x="938" y="465" class="badge" text-anchor="middle">6</text><text x="966" y="467" class="node-title" text-anchor="start">Observabilidade</text><text x="966" y="489" class="node-sub" text-anchor="start">status e evidência</text></g><g class="node"><rect x="716" y="432" width="194" height="104" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="744" cy="460" r="14" fill="#d97706"/><text x="744" y="465" class="badge" text-anchor="middle">7</text><text x="772" y="467" class="node-title" text-anchor="start">Retry controlado</text><text x="772" y="489" class="node-sub" text-anchor="start">volta sem duplicar</text></g><rect x="58" y="405" width="520" height="112" rx="14" fill="#e7edf7" stroke="#1e4a96"/><text x="82" y="437" class="section" text-anchor="start">RESPOSTA NÃO É PROCESSAMENTO</text><text x="82" y="466" class="note" text-anchor="start">A resposta confirma recebimento. O resultado final</text><text x="82" y="489" class="note" text-anchor="start">é acompanhado por status, logs e tentativas.</text>
  <line x1="58" y1="628" x2="1142" y2="628" stroke="#e3e5ea"/>
  <circle cx="70" cy="650" r="5" fill="#25acb9"/>
  <text x="84" y="654" class="footer">Responder rápido reduz timeout. Persistir antes de processar reduz perda.</text>
  <text x="1142" y="654" class="footer" text-anchor="end">SOUREI • N8N EM PRODUÇÃO</text>
</svg>

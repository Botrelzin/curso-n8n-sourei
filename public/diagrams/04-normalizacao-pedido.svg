  <g class="node"><rect x="58" y="196" width="220" height="294" rx="16" fill="#f4f6f9" stroke="#4b5563" stroke-width="2"/><circle cx="86" cy="224" r="14" fill="#4b5563"/><text x="86" y="229" class="badge" text-anchor="middle">{ }</text><text x="114" y="231" class="node-title" text-anchor="start">Pedido bruto</text><text x="114" y="253" class="node-sub" text-anchor="start">campos da plataforma</text></g><text x="82" y="285" class="mono" text-anchor="start">número do pedido</text><text x="82" y="312" class="mono" text-anchor="start">valor e moeda</text><text x="82" y="339" class="mono" text-anchor="start">itens e quantidades</text><text x="82" y="366" class="mono" text-anchor="start">cliente e contexto</text><text x="82" y="393" class="mono" text-anchor="start">status do pagamento</text><path d="M 278 343 L 438 343" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="438,343 427.0,336.4 427.0,349.6" fill="#12727c"/><rect x="303.0" y="318.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="358.0" y="334.0" class="edge-label" text-anchor="middle">mapear</text><g class="node"><rect x="438" y="224" width="252" height="238" rx="16" fill="#e7edf7" stroke="#1e4a96" stroke-width="2"/><circle cx="466" cy="252" r="14" fill="#1e4a96"/><text x="466" y="257" class="badge" text-anchor="middle">↺</text><text x="494" y="259" class="node-title" text-anchor="start">Normalizador</text><text x="494" y="281" class="node-sub" text-anchor="start">regras explícitas</text></g><text x="464" y="313" class="note" text-anchor="start">tipos consistentes</text><text x="464" y="340" class="note" text-anchor="start">nomes canônicos</text><text x="464" y="367" class="note" text-anchor="start">defaults seguros</text><text x="464" y="394" class="note" text-anchor="start">campos permitidos</text><path d="M 690 343 L 850 343" fill="none" stroke="#12727c" stroke-width="3" stroke-linecap="round"/><polygon points="850,343 839.0,336.4 839.0,349.6" fill="#12727c"/><rect x="715.0" y="318.0" width="110" height="22" rx="11" fill="#ffffff"/><text x="770.0" y="334.0" class="edge-label" text-anchor="middle">validar</text><g class="node"><rect x="850" y="196" width="292" height="294" rx="16" fill="#e2f4f5" stroke="#12727c" stroke-width="2"/><circle cx="878" cy="224" r="14" fill="#12727c"/><text x="878" y="229" class="badge" text-anchor="middle">✓</text><text x="906" y="231" class="node-title" text-anchor="start">Evento canônico</text><text x="906" y="253" class="node-sub" text-anchor="start">pronto para destinos</text></g><text x="876" y="285" class="mono" text-anchor="start">transaction_id</text><text x="876" y="312" class="mono" text-anchor="start">value + currency</text><text x="876" y="339" class="mono" text-anchor="start">items[]</text><text x="876" y="366" class="mono" text-anchor="start">user_data permitido</text><text x="876" y="393" class="mono" text-anchor="start">event_time</text><rect x="336" y="510" width="528" height="62" rx="14" fill="#fef3c7" stroke="#d97706"/><text x="600" y="548" class="note-strong" text-anchor="middle">Normalizar uma vez. Adaptar somente na borda de cada destino.</text>
  <line x1="58" y1="628" x2="1142" y2="628" stroke="#e3e5ea"/>
  <circle cx="70" cy="650" r="5" fill="#25acb9"/>
